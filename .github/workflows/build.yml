name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Publish APK as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk InkDrop.apk
          TAG="build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" InkDrop.apk \
            --title "InkDrop build ${GITHUB_RUN_NUMBER}" \
            --notes "Debug APK built from ${GITHUB_SHA::7}. Download InkDrop.apk and sideload it on the Boox." \
            --latest
