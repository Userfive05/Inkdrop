<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f8f5f2">
<title>InkDrop</title>
<style>
  :root {
    --bg: #f8f5f2;
    --ink: #141414;
    --muted: #5f5a55;
    --line: #e2ddd8;
    --accent: #a8432a;
    --accent-press: #8c3620;
    --danger: #b3261e;
    --ok: #2e7d32;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 18px; line-height: 1.35; }
  main { max-width: 640px; margin: 0 auto; padding: 18px 20px calc(40px + env(safe-area-inset-bottom)); }
  svg { display: block; flex: none; }

  /* Header */
  .brand { display: flex; align-items: center; gap: 12px; padding: 8px 0 18px; border-bottom: 1px solid var(--line); }
  .brand svg { width: 34px; height: 34px; color: var(--accent); }
  .brand h1 { margin: 0; font-size: 30px; font-weight: 800; letter-spacing: -0.5px; }
  .free { margin-left: auto; color: var(--muted); font-size: 14px; }

  /* Breadcrumbs */
  .crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; margin: 22px 0 6px; font-size: 18px; font-weight: 600; }
  .crumbs a { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; padding: 6px 0; }
  .crumbs .sep { color: var(--ink); font-size: 16px; }
  .crumbs .here { color: var(--ink); }

  .crumbs[style*="none"] + h2.title { margin-top: 26px; }
  h2.title { font-size: 40px; font-weight: 800; letter-spacing: -1px; margin: 4px 0 20px; word-break: break-word; line-height: 1.1; }

  /* Upload button */
  .upload { width: 100%; display: flex; align-items: center; justify-content: center; gap: 14px;
            min-height: 64px; border: 0; border-radius: 12px; background: var(--accent); color: #fff;
            font: inherit; font-size: 21px; font-weight: 600; cursor: pointer; }
  .upload:active { background: var(--accent-press); }
  .upload svg { width: 26px; height: 26px; }
  input[type=file] { display: none; }

  /* Upload progress */
  #queue:empty { display: none; }
  #queue { margin-top: 14px; border: 1px solid var(--line); border-radius: 12px; background: #fff; padding: 4px 16px; }
  .q { padding: 12px 0; border-bottom: 1px solid var(--line); }
  .q:last-child { border-bottom: 0; }
  .q-top { display: flex; gap: 12px; align-items: baseline; }
  .q-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; font-size: 16px; }
  .q-pct { font-size: 15px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .q-pct.ok { color: var(--ok); } .q-pct.err { color: var(--danger); }
  .bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin-top: 8px; }
  .bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }

  /* Sections & rows */
  h3 { font-size: 28px; font-weight: 800; margin: 30px 0 4px; }
  .row { display: flex; align-items: center; gap: 16px; min-height: 72px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  a.row { color: inherit; text-decoration: none; }
  a.row:active { background: #efe9e4; }
  .row .ico { width: 34px; height: 34px; }
  .row .ico.folder { color: var(--accent); }
  .row .txt { flex: 1; min-width: 0; }
  .row .name { font-weight: 700; font-size: 19px; overflow: hidden; word-break: break-word; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .row .meta { color: var(--muted); font-size: 16px; margin-top: 2px; }
  .row .chev { width: 24px; height: 24px; }
  .act { width: 52px; height: 52px; display: flex; align-items: center; justify-content: center;
         border: 0; background: none; color: var(--ink); border-radius: 10px; cursor: pointer; padding: 0; }
  .act:active { background: #efe9e4; }
  .act svg { width: 30px; height: 30px; }
  .empty { color: var(--muted); padding: 18px 0; font-size: 17px; }

  /* Confirm sheet */
  .sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: none; align-items: flex-end; justify-content: center; z-index: 10; }
  .sheet-bg.open { display: flex; }
  .sheet { background: #fff; width: 100%; max-width: 640px; border-radius: 18px 18px 0 0; padding: 24px 20px calc(20px + env(safe-area-inset-bottom)); }
  .sheet p { margin: 0 0 6px; font-size: 20px; font-weight: 700; }
  .sheet .sub { font-size: 16px; color: var(--muted); font-weight: 400; margin-bottom: 20px; word-break: break-word; }
  .sheet button { width: 100%; min-height: 56px; border-radius: 12px; font: inherit; font-weight: 600; font-size: 19px; cursor: pointer; }
  .sheet .del { background: var(--danger); color: #fff; border: 0; margin-bottom: 10px; }
  .sheet .cancel { background: #fff; color: var(--ink); border: 1px solid var(--line); }

  .toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translateX(-50%);
           background: var(--ink); color: #fff; padding: 12px 18px; border-radius: 10px; font-size: 16px;
           opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 90vw; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<main>
  <header class="brand">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 6.5A1.5 1.5 0 0 1 4.5 5h4.6l2 2.2h8.4A1.5 1.5 0 0 1 21 8.7v9.8A1.5 1.5 0 0 1 19.5 20h-15A1.5 1.5 0 0 1 3 18.5z"/></svg>
    <h1>InkDrop</h1>
    <span class="free" id="free"></span>
  </header>

  <nav class="crumbs" id="crumbs"></nav>
  <h2 class="title" id="title">…</h2>

  <button class="upload" id="uploadBtn" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20V4M5 11l7-7 7 7"/></svg>
    Upload files
  </button>
  <input type="file" id="pick" multiple>
  <div id="queue"></div>

  <div id="content"><div class="empty">Loading…</div></div>
</main>

<div class="sheet-bg" id="sheet">
  <div class="sheet">
    <p>Delete this file?</p>
    <div class="sub" id="sheetName"></div>
    <button class="del" id="sheetDel" type="button">Delete</button>
    <button class="cancel" id="sheetCancel" type="button">Cancel</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = b => { if (b < 1024) return b + ' B'; const u = ['KB','MB','GB','TB']; let i = -1; do { b /= 1024; i++; } while (b >= 1024 && i < u.length - 1); return b.toFixed(1) + ' ' + u[i]; };
const q = (dir, name) => '?dir=' + encodeURIComponent(dir) + (name != null ? '&name=' + encodeURIComponent(name) : '');

const ICON = {
  folder: '<svg class="ico folder" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M3 6.5A1.5 1.5 0 0 1 4.5 5h4.6l2 2.2h8.4A1.5 1.5 0 0 1 21 8.7v9.8A1.5 1.5 0 0 1 19.5 20h-15A1.5 1.5 0 0 1 3 18.5z"/></svg>',
  file: '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M6 3h8l5 5v12a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M14 3v5h5"/></svg>',
  chev: '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>',
  dl: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10.5l5 5 5-5M4 17v2.5h16V17"/></svg>',
  trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6.5h16M9.5 6.5V4.5h5v2M6.5 6.5l1 13.5h9l1-13.5M10.5 10v6.5M13.5 10v6.5"/></svg>'
};

// Current folder lives in the URL hash (#/Series/Dune) so the phone's back button works.
function currentDir() {
  return decodeURIComponent(location.hash.replace(/^#\/?/, '')).replace(/\/+$/, '');
}
function go(dir) { location.hash = '#/' + dir.split('/').map(encodeURIComponent).join('/'); }

let rootName = 'Books';

async function load() {
  const dir = currentDir();
  try {
    const r = await fetch('/api/list' + q(dir));
    if (!r.ok) { if (dir) { go(''); return; } throw new Error(await r.text()); }
    const d = await r.json();
    rootName = d.root || 'Books';
    render(dir, d);
  } catch (e) {
    $('#content').innerHTML = '<div class="empty">Can’t reach the e-reader. Make sure your phone is still on its Wi-Fi and InkDrop is open.</div>';
  }
}

function render(dir, d) {
  const parts = dir ? dir.split('/') : [];
  // Breadcrumbs: all ancestors as links, current folder as plain text
  let crumbs = '';
  if (parts.length) {
    crumbs += '<a href="#/">' + esc(rootName) + '</a>';
    parts.forEach((p, i) => {
      crumbs += '<span class="sep">›</span>';
      const path = parts.slice(0, i + 1).join('/');
      crumbs += i === parts.length - 1 ? '<span class="here">' + esc(p) + '</span>'
                                       : '<a href="#/' + path.split('/').map(encodeURIComponent).join('/') + '">' + esc(p) + '</a>';
    });
  }
  $('#crumbs').innerHTML = crumbs;
  $('#crumbs').style.display = parts.length ? '' : 'none';
  $('#title').textContent = parts.length ? parts[parts.length - 1] : rootName;
  $('#free').textContent = fmt(d.free) + ' free';
  document.title = $('#title').textContent + ' · InkDrop';

  let html = '';
  if (d.folders.length) {
    html += '<h3>Folders</h3>';
    for (const f of d.folders) {
      const path = (dir ? dir + '/' : '') + f.name;
      html += '<a class="row" href="#/' + path.split('/').map(encodeURIComponent).join('/') + '">' + ICON.folder +
              '<div class="txt"><div class="name">' + esc(f.name) + '</div><div class="meta">' + f.count + (f.count === 1 ? ' item' : ' items') + '</div></div>' +
              ICON.chev + '</a>';
    }
  }
  html += '<h3>Files</h3>';
  if (!d.files.length) {
    html += '<div class="empty">No files here yet. Tap <b>Upload files</b> to add some.</div>';
  } else {
    for (const f of d.files) {
      html += '<div class="row">' + ICON.file +
              '<div class="txt"><div class="name">' + esc(f.name) + '</div><div class="meta">' + fmt(f.size) + '</div></div>' +
              '<a class="act" href="/dl' + q(dir, f.name) + '" download="' + esc(f.name) + '" aria-label="Download ' + esc(f.name) + '">' + ICON.dl + '</a>' +
              '<button class="act" type="button" data-del="' + esc(f.name) + '" aria-label="Delete ' + esc(f.name) + '">' + ICON.trash + '</button>' +
              '</div>';
    }
  }
  $('#content').innerHTML = html;
}

// ---------- Uploads (one at a time, each into the folder that was open when it was picked)
const queue = [];
let busy = false;

function addFiles(files) {
  const dir = currentDir();
  for (const file of files) {
    const el = document.createElement('div');
    el.className = 'q';
    el.innerHTML = '<div class="q-top"><div class="q-name">' + esc(file.name) + '</div><div class="q-pct">Waiting</div></div><div class="bar"><i></i></div>';
    $('#queue').appendChild(el);
    queue.push({ file, dir, el });
  }
  next();
}

function next() {
  if (busy || !queue.length) return;
  busy = true;
  const { file, dir, el } = queue.shift();
  const bar = el.querySelector('.bar i'), pct = el.querySelector('.q-pct');
  const xhr = new XMLHttpRequest();
  xhr.open('POST', '/api/upload' + q(dir, file.name));
  xhr.upload.onprogress = e => { if (e.lengthComputable) { const p = e.loaded / e.total * 100; bar.style.width = p + '%'; pct.textContent = Math.floor(p) + '%'; } };
  xhr.onload = () => {
    if (xhr.status === 200) { bar.style.width = '100%'; pct.textContent = 'Done'; pct.className = 'q-pct ok'; setTimeout(() => el.remove(), 2000); }
    else { pct.textContent = 'Failed'; pct.className = 'q-pct err'; toast(xhr.responseText || 'Upload failed'); }
    done();
  };
  xhr.onerror = () => { pct.textContent = 'Failed'; pct.className = 'q-pct err'; toast('Lost connection during upload'); done(); };
  xhr.send(file);
  function done() { busy = false; if (dir === currentDir()) load(); next(); }
}

$('#uploadBtn').addEventListener('click', () => $('#pick').click());
$('#pick').addEventListener('change', e => { addFiles(e.target.files); e.target.value = ''; });
document.addEventListener('dragover', e => e.preventDefault());
document.addEventListener('drop', e => { e.preventDefault(); if (e.dataTransfer.files.length) addFiles(e.dataTransfer.files); });

// ---------- Delete with a bottom-sheet confirm (easier to hit than a browser dialog)
let pendingDelete = null;
$('#content').addEventListener('click', e => {
  const b = e.target.closest('[data-del]');
  if (!b) return;
  pendingDelete = { dir: currentDir(), name: b.dataset.del };
  $('#sheetName').textContent = pendingDelete.name;
  $('#sheet').classList.add('open');
});
function closeSheet() { $('#sheet').classList.remove('open'); pendingDelete = null; }
$('#sheetCancel').addEventListener('click', closeSheet);
$('#sheet').addEventListener('click', e => { if (e.target.id === 'sheet') closeSheet(); });
$('#sheetDel').addEventListener('click', async () => {
  const p = pendingDelete; closeSheet();
  if (!p) return;
  const r = await fetch('/api/delete' + q(p.dir, p.name), { method: 'POST' });
  toast(r.ok ? 'Deleted ' + p.name : 'Couldn’t delete ' + p.name);
  load();
});

let toastTimer;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
}

window.addEventListener('hashchange', load);
load();
</script>
</body>
</html>
